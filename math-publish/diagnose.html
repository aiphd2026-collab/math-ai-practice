<!doctype html><html lang="zh-Hans"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>数学练习提交接口诊断</title><style>body{font:18px/1.7 system-ui,"Microsoft YaHei",sans-serif;max-width:720px;margin:2rem auto;padding:0 1rem}button{font-size:1rem;padding:12px 20px;margin:8px 8px 8px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f2f2f2;padding:16px;border-radius:8px}</style></head><body><h1>数学练习提交接口诊断</h1><p>本页只执行网络连通检查，<strong>不提交学生答案、不写入数据库</strong>。注意：浏览器跨域限制可能使 GET 检查失败；这不代表旧版 POST 提交失效。</p><button id="get">检查 GET（只读）</button><button id="open">在新窗口打开 Apps Script</button><pre id="out">尚未检查</pre><p>完整发布验收必须另行进行真实测试提交，并从 Google Sheets 读回确认。单凭浏览器请求成功不能判定数据库写入成功。</p><script>const url='https://script.google.com/macros/s/AKfycbw8myNrNJoCF7Fk3au3mexUsZrChBqUox2C6jELNEJluYqCKssY27it8rNfzB2zyoMN/exec';const out=document.getElementById('out');document.getElementById('open').onclick=()=>window.open(url,'_blank','noopener,noreferrer');document.getElementById('get').onclick=async()=>{out.textContent='正在检查…';const c=new AbortController();const t=setTimeout(()=>c.abort(),12000);try{const r=await fetch(url,{method:'GET',redirect:'follow',cache:'no-store',signal:c.signal});const txt=(await r.text()).slice(0,800);out.textContent='HTTP '+r.status+'\n内容类型：'+r.headers.get('content-type')+'\n'+txt+'\n\n注意：这仅是 GET 检查，不是 POST 提交验收。';}catch(e){out.textContent='GET 响应不可读：'+e+'\n可能为跨域限制、网络错误或超时。请使用「在新窗口打开」进一步检查，不要因此认定 POST 接口失效。';}finally{clearTimeout(t)}};</script></body></html>
