<!doctype html>
<html lang="zh-Hans"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>初中数学｜TEST练习卷｜蓝志东博士</title><style>
:root{font-family:"Microsoft YaHei",system-ui,sans-serif;color:#203047;background:#f3f6fc}*{box-sizing:border-box}body{margin:0}.wrap{max-width:780px;margin:auto;padding:20px}.head{background:linear-gradient(110deg,#245b9d,#5775c5);color:white;padding:25px;border-radius:20px}h1{font-size:1.5rem;margin:0 0 10px}.card{background:white;border-radius:18px;padding:24px;margin:18px 0;box-shadow:0 4px 20px #21334a12}.muted{color:#56637b}.option{display:block;width:100%;text-align:left;background:#f4f7ff;border:2px solid #dfe7f4;padding:15px;border-radius:12px;margin:12px 0;font-size:1.1rem;cursor:pointer}.option.selected{border-color:#275bb1;background:#e2ecff}button.action{border:0;border-radius:12px;background:#245b9d;color:white;padding:14px 22px;font-size:1.05rem;cursor:pointer}button:disabled{opacity:.4;cursor:not-allowed}.progress{font-weight:bold;color:#305c9c}.warn{background:#fff5df;padding:13px;border-radius:12px;color:#76501b}.correct{color:#14744b}.wrong{color:#b63b3b}#result{display:none}</style></head><body><main class="wrap"><header class="head"><h1>初中数学｜TEST线上练习卷</h1><div>蓝志东博士 · 测试卷 TEST-GH-20261016-001</div><p>本卷只验证 GitHub Pages 公开链接、逐题作答、评分与反馈。不会上传学生个人资料。</p></header><section class="card" id="quiz"><div class="progress" id="progress"></div><h2 id="question"></h2><div id="options"></div><button class="action" id="next" disabled>下一题</button></section><section class="card" id="result"><h2>测试完成</h2><h1 id="score"></h1><div id="review"></div><p class="warn">数据库提交：未启用。本测试不会向 Google Sheets 或 Apps Script 发送数据；本地得分不代表数据库写入成功。</p><button class="action" onclick="location.reload()">重新测试</button></section><p class="muted">版本：独立TEST · 不影响任何正式试卷及历史数据。</p></main><script>
const qs=[
{q:"计算：(-3)+8 = ?",o:["5","-5","11","-11"],a:0,e:"异号两数相加，用较大绝对值减较小绝对值，结果取8的正号。"},
{q:"若 2x+3=11，则 x = ?",o:["3","5","7","4"],a:3,e:"2x=8，因此x=4。"},
{q:"化简比 12:18，结果是？",o:["3:2","2:3","6:9","4:9"],a:1,e:"前后项同时除以6，得到2:3。"},
{q:"一个三角形的两个角分别为50°、60°，第三个角为？",o:["60°","80°","90°","70°"],a:3,e:"三角形内角和180°，所以180°-50°-60°=70°。"},
{q:"直角三角形两直角边为3 cm和4 cm，斜边为？",o:["7 cm","6 cm","5 cm","4 cm"],a:2,e:"根据毕氏定理，斜边为√(3²+4²)=5 cm。"}];
let i=0,sel=null;const answers=[];const $=id=>document.getElementById(id);
function draw(){sel=null;$("next").disabled=true;$("next").textContent=i===qs.length-1?"完成并查看成绩":"下一题";$("progress").textContent="第 "+(i+1)+" / "+qs.length+" 题";$("question").textContent=qs[i].q;$("options").replaceChildren();qs[i].o.forEach((v,j)=>{let b=document.createElement("button");b.className="option";b.textContent=String.fromCharCode(65+j)+". "+v;b.onclick=()=>{sel=j;document.querySelectorAll(".option").forEach(x=>x.classList.remove("selected"));b.classList.add("selected");$("next").disabled=false};$("options").appendChild(b)})}
$("next").onclick=()=>{if(sel===null)return;answers.push(sel);i++;if(i<qs.length){draw();scrollTo({top:0,behavior:"smooth"});return}$("quiz").hidden=true;$("result").style.display="block";let n=answers.filter((x,j)=>x===qs[j].a).length;$("score").textContent=n+" / "+qs.length+" 题正确";qs.forEach((q,j)=>{let p=document.createElement("p");p.className=answers[j]===q.a?"correct":"wrong";p.textContent="第"+(j+1)+"题："+(answers[j]===q.a?"正确":"错误")+"｜正确答案 "+String.fromCharCode(65+q.a)+"。"+q.e;$("review").appendChild(p)});scrollTo({top:0,behavior:"smooth"})};draw();
</script></body></html>
